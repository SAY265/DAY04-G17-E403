# Day 04 — Optimized Tool Declarations (v3)
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng để làm rõ thông tin còn thiếu hoặc xin xác nhận trước khi thực hiện hành động nhạy cảm."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi từ người dùng"}
        options: {type: array, default: [], items: {type: string}, description: "Các tùy chọn cho người dùng lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một người dùng trên X/Twitter theo tên tài khoản (screenname)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản Twitter (ví dụ: 'sama', 'elonmusk')"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng muốn lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm bài đăng trên mạng xã hội X/Twitter theo từ khóa."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên Twitter"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp kết quả"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng tối đa"}
      required: [query]

  - name: lookup
    description: "Tra cứu bài báo, tin tức và thông tin tổng hợp trên Internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm (chỉ lấy từ khóa cốt lõi)"}
        topic: {type: string, enum: [general, news], default: "general", description: "Chủ đề tra cứu ('general' hoặc 'news')"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian giới hạn ('day', 'week', 'month', 'year')"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Tải và đọc nội dung chi tiết dạng Markdown của một trang web theo địa chỉ URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL của trang web cần đọc (bắt đầu bằng http:// hoặc https://)"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành bản tóm tắt/digest hoàn chỉnh."
    parameters:
      type: object
      properties:
        raw_items: {type: array, default: [], items: {type: object}, description: "Danh sách dữ liệu thô"}
        title: {type: string, default: "Research Digest", description: "Tiêu đề bản tóm tắt"}
      required: [raw_items]

  - name: send
    description: "Gửi bản tin hoặc thông báo lên kênh Telegram bên ngoài (CẦN XÁC NHẬN BẰNG CLARIFY TRƯỚC KHI GỌI)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản muốn gửi"}
      required: [text]

  - name: policy
    description: "Tra cứu tài liệu quy định và chính sách nội bộ công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm chính sách"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: papers
    description: "Tìm kiếm bài báo khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm bài báo khoa học"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải nội dung văn bản chi tiết của bài báo khoa học arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "URL hoặc ID bài báo trên arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]

  - name: calculator
    description: "Thực hiện tính toán biểu thức toán học."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học (ví dụ: '2 + 2', 'sqrt(16)', '15 * 1.2')"}
      required: [expression]
